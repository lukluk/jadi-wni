# Manifest Kubernetes "Jadi WNI". Placeholder __X__ diisi oleh deploy/deploy.sh.
#
# Catatan arsitektur: state room ada di memori + SQLite, jadi HARUS 1 replika
# (strategy Recreate, volume ReadWriteOnce). Scale-out butuh Redis adapter + DB bersama.
apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jadi-wni-config
  namespace: __NAMESPACE__
data:
  ORIGIN: "https://__HOST__"
  DB_PATH: "/data/app.db"
  # login tamu hanya untuk testing lokal; jangan aktifkan di production
  ALLOW_DEV_LOGIN: "false"
  # di belakang ingress TLS: percaya header proxy untuk protokol/host
  PROTOCOL_HEADER: "x-forwarded-proto"
  HOST_HEADER: "x-forwarded-host"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jadi-wni-data
  namespace: __NAMESPACE__
spec:
  accessModes: ["ReadWriteOnce"]
  __STORAGE_CLASS_LINE__
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jadi-wni
  namespace: __NAMESPACE__
  labels: { app: jadi-wni }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: jadi-wni }
  template:
    metadata:
      labels: { app: jadi-wni }
    spec:
      # volume milik uid 1000 (user "node" di image)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: jadi-wni-config }
            - secretRef: { name: jadi-wni-secret }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jadi-wni-data
---
apiVersion: v1
kind: Service
metadata:
  name: jadi-wni
  namespace: __NAMESPACE__
spec:
  selector: { app: jadi-wni }
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jadi-wni
  namespace: __NAMESPACE__
  annotations:
    # WebSocket (Socket.IO) + sinyal WebRTC: koneksi panjang, jangan diputus proxy
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    __CERT_ANNOTATION__
spec:
  ingressClassName: __INGRESS_CLASS__
  tls:
    - hosts: ["__HOST__"]
      secretName: jadi-wni-tls
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jadi-wni
                port:
                  name: http
